<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f2"><meta name="description" content="WBoard — 简洁、自由、可本地保存的在线无限白板">
<title>WBoard — Infinite Canvas</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f5f5f2;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}.top{height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:0 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(24px);border-bottom:1px solid #e9e9e5;z-index:5}
.brand{font-size:17px;font-weight:750;letter-spacing:-.7px}.brand span{font-weight:400;color:#85857f}.file{margin-left:16px;max-width:220px;border:0;background:transparent;font-size:13px;outline:none}
.spacer{flex:1}.status{font-size:11px;color:#999;margin-right:8px}.btn{height:34px;padding:0 12px;border-radius:10px;font-size:12px;color:#555;transition:.18s}.btn:hover{background:#f0f0ed}.btn.primary{background:#242424;color:#fff}.btn.primary:hover{background:#444}
.workspace{flex:1;position:relative;overflow:hidden;background-color:#f7f7f4;background-image:radial-gradient(#d9d9d3 1px,transparent 1px);background-size:22px 22px;touch-action:none}
#world{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;transform-origin:0 0}
.toolbar{position:absolute;z-index:4;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border:1px solid #e9e9e5;border-radius:15px;box-shadow:0 8px 30px #0000000c}
.tool{width:40px;height:38px;flex:none;transition:background .16s,color .16s,transform .16s;border-radius:10px;display:grid;place-items:center;color:#666;font-size:17px}.tool:hover{background:#f1f1ed}.tool.active{background:#242424;color:white}.sep{width:1px;background:#e8e8e3;margin:5px 3px}
.panel{position:absolute;z-index:4;right:18px;top:18px;display:flex;gap:6px;padding:5px;background:#ffffffd9;backdrop-filter:blur(18px);border:1px solid #e9e9e5;border-radius:13px}
.bottom{position:absolute;bottom:18px;left:18px;z-index:4;padding:9px 12px;background:#ffffffd9;backdrop-filter:blur(18px);border:1px solid #e9e9e5;border-radius:12px;font-size:11px;color:#888}
.zoom{position:absolute;bottom:18px;right:18px;z-index:4;display:flex;align-items:center;gap:3px;padding:5px;background:#ffffffdf;border:1px solid #e9e9e5;border-radius:12px}.zoom button{width:30px;height:28px;border-radius:8px}.zoom button:hover{background:#eee}.zoom span{font-size:11px;color:#777;min-width:42px;text-align:center}
.item{position:absolute;transform-origin:top left;user-select:none;touch-action:none}.note{width:210px;min-height:150px;padding:17px 18px;border-radius:3px 3px 12px 12px;box-shadow:0 5px 18px #00000012;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55;outline:none;cursor:move}.note:focus{outline:2px solid #555;outline-offset:2px}.note.yellow{background:#fff2b8}.note.pink{background:#f8dfe4}.note.blue{background:#dcecf7}.note.green{background:#e0efdf}
.textitem{min-width:90px;min-height:28px;padding:7px 9px;font-size:18px;white-space:pre-wrap;outline:none;cursor:move}.shape{position:absolute;border:2px solid #343434;background:#ffffff18}.shape.ellipse{border-radius:50%}.shape.rect{border-radius:8px}.line{position:absolute;height:2px;background:#444;transform-origin:left center}.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:10px solid #444;border-top:6px solid transparent;border-bottom:6px solid transparent}
.item.selected{outline:2px solid #6a8cff;outline-offset:3px}.draw{position:absolute;pointer-events:none;overflow:visible}.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#aaa;pointer-events:none}.empty strong{display:block;font-size:18px;color:#777;font-weight:550;margin-bottom:7px}.empty small{font-size:12px}
@media(max-width:700px){.top{height:56px;padding:0 10px;gap:5px}.file{margin-left:4px;width:100px}.status{display:none}.toolbar{top:auto;bottom:68px;max-width:calc(100% - 20px);overflow-x:auto;left:10px;right:10px;transform:none;justify-content:flex-start}.tool{flex:none}.panel{top:10px;right:10px}.panel .btn{padding:0 8px}.bottom{display:none}.zoom{bottom:12px;right:12px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">WBoard<span> / canvas</span></div><input id="boardName" class="file" value="未命名白板" aria-label="白板名称"><div class="spacer"></div><span id="saveState" class="status">已自动保存</span><button class="btn" id="undo">撤销</button><button class="btn" id="redo">重做</button><button class="btn" id="export">导出</button><button class="btn primary" id="share">保存 JSON</button></header>
<main id="workspace" class="workspace">
<div class="toolbar" role="toolbar" aria-label="白板工具">
<button class="tool active" data-tool="select" title="选择 V">↖</button><button class="tool" data-tool="hand" title="移动画布 H">✥</button><i class="sep"></i>
<button class="tool" data-tool="note" title="便签 N">▤</button><button class="tool" data-tool="text" title="文字 T">T</button><button class="tool" id="addImage" title="插入图片">▧</button><input id="imageInput" type="file" accept="image/*" hidden><button class="tool" data-tool="rect" title="矩形 R">□</button><button class="tool" data-tool="ellipse" title="椭圆 O">○</button><button class="tool" data-tool="arrow" title="箭头 A">↗</button><button class="tool" data-tool="pen" title="画笔 P">✎</button><i class="sep"></i>
<button class="tool" data-tool="delete" title="删除 Delete">⌫</button>
</div>
<div class="panel"><button class="btn" id="gridToggle">网格 ✓</button><button class="btn" id="clear">清空</button><button class="btn" id="import">导入</button><input id="fileInput" type="file" accept="application/json" hidden></div>
<div id="world"><div id="items"></div><svg id="ink" class="draw" width="10000" height="10000"></svg></div>
<div id="empty" class="empty"><strong>从这里开始构建想法</strong><small>选择便签、文字或形状工具，在画布上点击或拖动</small></div>
<div class="bottom">WBoard · 本地优先 · 数据保存在当前浏览器</div>
<div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button><button id="fit" title="重置视图">⌂</button></div>
</main></div>
<script>
(()=>{
const $=s=>document.querySelector(s), workspace=$('#workspace'), world=$('#world'), itemsEl=$('#items'), ink=$('#ink');
let tool='select',objects=[],selected=null,scale=1,tx=0,ty=0,drag=null,history=[],future=[],grid=true,penPath=null;
const uid=()=>Math.random().toString(36).slice(2,10);
const save=()=>{localStorage.setItem('wboard-data',JSON.stringify({name:$('#boardName').value,objects,view:{scale,tx,ty}}));$('#saveState').textContent='已自动保存'};
const snapshot=()=>{history.push(JSON.stringify(objects));if(history.length>80)history.shift();future=[]};
const restore=()=>{itemsEl.innerHTML='';ink.innerHTML='';objects.forEach(render);$('#empty').style.display=objects.length?'none':'block';save()};
const setView=()=>{world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;$ ('#zoomLabel').textContent=Math.round(scale*100)+'%'};
const point=e=>({x:(e.clientX-tx)/scale,y:(e.clientY-ty)/scale});
const render=o=>{
 if(o.type==='path'){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',o.d);p.setAttribute('fill','none');p.setAttribute('stroke',o.color||'#333');p.setAttribute('stroke-width',o.width||3);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');p.dataset.id=o.id;ink.append(p);return}
 const el=document.createElement('div');el.className='item';el.dataset.id=o.id;el.style.left=o.x+'px';el.style.top=o.y+'px';
 if(o.type==='note'){el.classList.add('note',o.color||'yellow');el.contentEditable='false';el.textContent=o.text||'双击编辑便签';el.title='双击编辑 · 拖动移动';el.addEventListener('dblclick',()=>{el.contentEditable='true';el.focus()});el.addEventListener('input',()=>{o.text=el.textContent;save()});el.addEventListener('blur',()=>{el.contentEditable='false';save()});}
 if(o.type==='text'){el.classList.add('textitem');el.contentEditable='false';el.textContent=o.text||'输入文字';el.style.color=o.color||'#252525';el.title='双击编辑 · 拖动移动';el.addEventListener('dblclick',()=>{el.contentEditable='true';el.focus()});el.addEventListener('input',()=>{o.text=el.textContent;save()});el.addEventListener('blur',()=>{el.contentEditable='false';save()});}
 if(o.type==='image'){const img=document.createElement('img');img.src=o.src;img.alt=o.alt||'白板图片';img.draggable=false;img.style.cssText=`display:block;width:${o.w}px;height:${o.h}px;object-fit:contain;border-radius:8px;pointer-events:none`;el.style.cursor='grab';el.title='拖动移动图片';el.append(img);}
 if(o.type==='rect'||o.type==='ellipse'){el.classList.add('shape',o.type);el.style.width=o.w+'px';el.style.height=o.h+'px'}
 if(o.type==='arrow'){el.classList.add('line','arrow');el.style.width=o.w+'px';el.style.transform=`rotate(${o.angle}rad)`}
 if(o.type==='line'){el.classList.add('line');el.style.width=o.w+'px';el.style.transform=`rotate(${o.angle}rad)`}
 if(!['note','text','image'].includes(o.type))el.style.pointerEvents='none';
 itemsEl.append(el);
};
const add=o=>{snapshot();objects.push(o);render(o);$('#empty').style.display='none';save()};
const choose=t=>{tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));workspace.style.cursor=t==='hand'?'grab':t==='select'?'default':t==='pen'?'crosshair':'crosshair'};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>choose(b.dataset.tool));
function select(id){selected=id;document.querySelectorAll('.item').forEach(e=>e.classList.toggle('selected',e.dataset.id===id))}
workspace.addEventListener('pointerdown',e=>{
 if(e.target.closest('button,input'))return;
 const p=point(e),el=e.target.closest('.item');
 if(tool==='hand'||e.button===1){drag={kind:'pan',sx:e.clientX,sy:e.clientY,tx,ty};workspace.setPointerCapture(e.pointerId);return}
 if(tool==='select'&&!el){select(null);return}
 if(tool==='select'&&el){select(el.dataset.id);const o=objects.find(x=>x.id===selected);if(o){drag={kind:'move',id:o.id,sx:p.x,sy:p.y,x:o.x,y:o.y};workspace.setPointerCapture(e.pointerId)}return}
 if(tool==='delete'&&el){snapshot();objects=objects.filter(o=>o.id!==el.dataset.id);restore();return}
 if(tool==='pen'){penPath={id:uid(),type:'path',d:`M ${p.x} ${p.y}`};snapshot();objects.push(penPath);render(penPath);workspace.setPointerCapture(e.pointerId);return}
 if(['note','text'].includes(tool)){const o={id:uid(),type:tool,x:p.x,y:p.y,text:tool==='note'?'双击编辑便签':'输入文字',color:tool==='note'?'yellow':'#252525'};add(o);select(o.id);const node=itemsEl.querySelector(`[data-id="${o.id}"]`);if(node){node.focus();document.execCommand('selectAll',false,null)}return}
 if(['rect','ellipse','arrow'].includes(tool)){snapshot();const o={id:uid(),type:tool,x:p.x,y:p.y,w:1,h:1,angle:0};objects.push(o);drag={kind:'draw',id:o.id,sx:p.x,sy:p.y};render(o);workspace.setPointerCapture(e.pointerId)}
});
workspace.addEventListener('pointermove',e=>{
 const p=point(e);
 if(penPath){penPath.d+=` L ${p.x} ${p.y}`;ink.querySelector(`[data-id="${penPath.id}"]`)?.setAttribute('d',penPath.d);return}
 if(!drag)return;
 if(drag.kind==='pan'){tx=drag.tx+e.clientX-drag.sx;ty=drag.ty+e.clientY-drag.sy;setView();return}
 const o=objects.find(x=>x.id===drag.id);if(!o)return;
 if(drag.kind==='move'){o.x=drag.x+p.x-drag.sx;o.y=drag.y+p.y-drag.sy;const node=itemsEl.querySelector(`[data-id="${o.id}"]`);if(node){node.style.left=o.x+'px';node.style.top=o.y+'px'}}
 if(drag.kind==='draw'){const dx=p.x-drag.sx,dy=p.y-drag.sy;o.x=Math.min(p.x,drag.sx);o.y=Math.min(p.y,drag.sy);o.w=Math.max(2,Math.abs(dx));o.h=Math.max(2,Math.abs(dy));o.angle=Math.atan2(dy,dx);const node=itemsEl.querySelector(`[data-id="${o.id}"]`);if(node){node.style.left=o.x+'px';node.style.top=o.y+'px';node.style.width=o.w+'px';node.style.height=o.h+'px';if(o.type==='arrow')node.style.transform=`rotate(${o.angle}rad)`}}
});
workspace.addEventListener('pointerup',()=>{if(penPath){penPath=null;save()}if(drag){drag=null;save()}});
workspace.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey){tx-=e.deltaX;ty-=e.deltaY;setView();return}e.preventDefault();const old=scale,ns=Math.max(.25,Math.min(2.5,scale*(e.deltaY<0?1.08:.92)));const r=workspace.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;tx=cx-(cx-tx)*ns/old;ty=cy-(cy-ty)*ns/old;scale=ns;setView()},{passive:false});
function zoom(f){const r=workspace.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,ns=Math.max(.25,Math.min(2.5,scale*f));tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;setView()}
$('#zoomIn').onclick=()=>zoom(1.15);$('#zoomOut').onclick=()=>zoom(.87);$('#fit').onclick=()=>{scale=1;tx=ty=0;setView()};
$('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(objects));objects=JSON.parse(history.pop());restore()};
$('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(objects));objects=JSON.parse(future.pop());restore()};
$('#clear').onclick=()=>{if(!objects.length||!confirm('确定清空当前白板？'))return;snapshot();objects=[];restore()};
$('#gridToggle').onclick=()=>{grid=!grid;workspace.style.backgroundImage=grid?'radial-gradient(#d9d9d3 1px,transparent 1px)':'none';$('#gridToggle').textContent=grid?'网格 ✓':'网格'};
function download(name,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('#share').onclick=()=>download('WBoard-'+Date.now()+'.json',JSON.stringify({version:1,name:$('#boardName').value,objects},null,2),'application/json');
$('#export').onclick=()=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="100%" height="100%" fill="#f7f7f4"/>${objects.map(o=>{if(o.type==='path')return `<path d="${o.d}" fill="none" stroke="#333" stroke-width="3"/>`;if(o.type==='rect')return `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="none" stroke="#333" stroke-width="2"/>`;if(o.type==='ellipse')return `<ellipse cx="${o.x+o.w/2}" cy="${o.y+o.h/2}" rx="${o.w/2}" ry="${o.h/2}" fill="none" stroke="#333" stroke-width="2"/>`;if(o.type==='note'||o.type==='text')return `<text x="${o.x+8}" y="${o.y+24}" font-size="16" fill="#222">${String(o.text||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</text>`;return ''}).join('')}</svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1000;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='WBoard.png';a.click()})};img.src=url};
$('#import').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.objects))throw Error();snapshot();objects=d.objects;$('#boardName').value=d.name||'导入的白板';restore()}catch{alert('文件格式无效，无法导入')}e.target.value=''};
$('#boardName').oninput=save;
$('#addImage').onclick=()=>$('#imageInput').click();
$('#imageInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('请选择图片文件');return}if(file.size>12*1024*1024){alert('图片原文件超过 12 MB，请先压缩后再上传');e.target.value='';return}try{const src=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src});const max=1600,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const compressed=canvas.toDataURL('image/jpeg',.84);const r=workspace.getBoundingClientRect(),p=point({clientX:r.left+r.width/2,clientY:r.top+r.height/2});add({id:uid(),type:'image',x:p.x,y:p.y,src:compressed,alt:file.name,w:canvas.width,h:canvas.height});}catch(err){alert('图片处理失败，请更换图片后重试')}e.target.value=''};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('#redo').click();return}const keys={v:'select',h:'hand',n:'note',t:'text',r:'rect',o:'ellipse',a:'arrow',p:'pen'};if(keys[e.key.toLowerCase()])choose(keys[e.key.toLowerCase()]);if(e.key==='Delete'&&selected){snapshot();objects=objects.filter(o=>o.id!==selected);selected=null;restore()}if(e.key==='Escape')select(null)});
try{const d=JSON.parse(localStorage.getItem('wboard-data')||'null');if(d){objects=d.objects||[];$('#boardName').value=d.name||'未命名白板';if(d.view){scale=d.view.scale||1;tx=d.view.tx||0;ty=d.view.ty||0}}}catch{}restore();setView();
})();
</script>
<style>
.wb-extra{height:34px;padding:0 12px;border-radius:10px;background:#f0f0ed;color:#444;font-size:12px}.wb-extra.dark{background:#242424;color:#fff}
#wbHub,#wbMind{position:fixed;inset:62px 0 0;z-index:20;background:#f7f7f4;display:none;overflow:auto;color:#222}#wbHub.open,#wbMind.open{display:block}
.wb-shell{max-width:1180px;margin:auto;padding:28px 24px 60px}.wb-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.wb-head h1{font-size:24px;margin:0;font-weight:650}.wb-head p{font-size:12px;color:#888;margin:5px 0 0}.wb-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.wb-btn{border:0;border-radius:10px;padding:9px 13px;background:#ecece7;color:#333;font-size:12px;cursor:pointer}.wb-btn.primary{background:#222;color:#fff}.wb-tabs{display:flex;gap:5px;margin-bottom:18px;background:#eeeee9;padding:4px;border-radius:12px;width:max-content}.wb-tab{padding:8px 15px;border:0;border-radius:9px;background:transparent;color:#777;font-size:12px;cursor:pointer}.wb-tab.active{background:white;color:#222}
.wb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wb-card{background:#fff;border:1px solid #ecece7;border-radius:15px;padding:17px}.wb-project{cursor:pointer}.wb-project h3{margin:0 0 7px;font-size:15px}.wb-project p{margin:0;color:#888;font-size:12px;line-height:1.6}.wb-meta{display:flex;justify-content:space-between;margin-top:16px;color:#999;font-size:11px}.wb-empty{padding:34px;text-align:center;color:#999;background:#fff;border:1px dashed #ddd;border-radius:14px;font-size:13px}
.wb-kanban{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;overflow-x:auto}.wb-lane{background:#efefeb;border-radius:13px;padding:10px;min-height:220px}.wb-lane h3{font-size:12px;color:#777;margin:3px 4px 10px}.wb-task{background:white;border:1px solid #e9e9e4;border-radius:10px;padding:11px;margin-bottom:8px}.wb-task strong{font-size:12px;display:block;margin-bottom:7px}.wb-task small{font-size:10px;color:#999}.wb-task select{margin-top:8px;width:100%;border:0;background:#f5f5f2;padding:6px;border-radius:7px;font-size:11px}
#wbMind{overflow:hidden}.wb-mindbar{height:54px;display:flex;align-items:center;gap:7px;padding:0 18px;background:#ffffffdc;border-bottom:1px solid #e9e9e5}.wb-mindbar strong{font-size:13px;margin-right:8px}.wb-mindstage{position:absolute;inset:54px 0 0;overflow:auto;background-image:radial-gradient(#d9d9d3 1px,transparent 1px);background-size:22px 22px}#wbMindSvg{position:absolute;inset:0;width:3000px;height:2000px;pointer-events:none}.wb-mindnode{position:absolute;min-width:140px;max-width:220px;padding:12px 16px;background:#fff;border:1px solid #deded8;border-radius:12px;box-shadow:0 3px 12px #0000000b;text-align:center;font-size:13px;cursor:grab;user-select:none;touch-action:none}.wb-mindnode.root{background:#242424;color:white;border-color:#242424;font-weight:650}.wb-mindnode.selected{outline:2px solid #7894ff;outline-offset:2px}
@media(max-width:700px){#wbHub,#wbMind{inset:54px 0 0}.wb-shell{padding:20px 14px 40px}.wb-grid{grid-template-columns:1fr}.wb-head{align-items:flex-start;flex-wrap:wrap}.wb-actions{margin-left:0;width:100%}.wb-kanban{grid-template-columns:repeat(4,220px)}.wb-mindbar{padding:0 8px;overflow-x:auto}.wb-extra{padding:0 8px;font-size:11px}}
</style>
<div id="wbHub"><div class="wb-shell">
<div class="wb-head"><div><h1>项目空间</h1><p>项目、任务与思维导图集中管理</p></div><div class="wb-actions"><button class="wb-btn" id="wbBack">返回白板</button><button class="wb-btn" id="wbGitSettings">GitHub 设置</button><button class="wb-btn primary" id="wbNewProject">＋ 新建项目</button></div></div>
<div class="wb-tabs"><button class="wb-tab active" data-view="projects">项目</button><button class="wb-tab" data-view="tasks">任务看板</button></div>
<section id="wbProjectsView"><div class="wb-grid" id="wbProjectGrid"></div></section>
<section id="wbTasksView" hidden><div class="wb-head"><div><h1 id="wbTaskProjectName">任务看板</h1><p>调整任务状态，跟踪项目进度</p></div><div class="wb-actions"><button class="wb-btn" id="wbAddTask">＋ 新建任务</button><button class="wb-btn" id="wbOpenMind">打开思维导图</button></div></div><div class="wb-kanban" id="wbKanban"></div></section>
</div></div>
<div id="wbMind"><div class="wb-mindbar"><strong id="wbMindTitle">思维导图</strong><button class="wb-btn" id="wbMindBack">返回项目</button><button class="wb-btn" id="wbAddNode">＋ 添加节点</button><button class="wb-btn" id="wbConnect">连接所选节点</button><button class="wb-btn" id="wbDeleteNode">删除节点</button></div><div class="wb-mindstage" id="wbMindStage"><svg id="wbMindSvg"></svg><div id="wbMindNodes"></div></div></div>
<script>
(()=>{
const REPO='wangwenzhiwwz/WBoard',PATH='data/workspace.json', $=s=>document.querySelector(s),hub=$('#wbHub'),mind=$('#wbMind');
const fresh=()=>({projects:[]});let data=JSON.parse(localStorage.getItem('wboard-workspace')||'null')||fresh(),active=null,token=sessionStorage.getItem('wboard-gh-token')||'',remoteSha=null,selectedNode=null,dragNode=null,connectFrom=null;
const uid=()=>Math.random().toString(36).slice(2,10),persist=()=>localStorage.setItem('wboard-workspace',JSON.stringify(data)),project=()=>data.projects.find(p=>p.id===active),headers=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'});
function settings(){const v=prompt('输入对仓库 Contents 具有读写权限的 GitHub Token。仅保存在当前浏览器会话。',token);if(v===null)return;token=v.trim();if(token)sessionStorage.setItem('wboard-gh-token',token);else sessionStorage.removeItem('wboard-gh-token');alert(token?'Token 已保存至当前会话':'已清除 Token');if(token)loadRemote()}
async function loadRemote(){if(!token)return;try{const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+PATH,{headers:headers()});if(r.status===404)return;if(!r.ok)throw Error('GitHub 读取失败 '+r.status);const f=await r.json();remoteSha=f.sha;const bytes=Uint8Array.from(atob(f.content.replace(/\n/g,'')),c=>c.charCodeAt(0));data=JSON.parse(new TextDecoder().decode(bytes));persist();renderProjects()}catch(e){alert(e.message)}}
async function saveRemote(){persist();if(!token){alert('当前已保存在本地。请先设置 GitHub Token 后再同步。');return}const bytes=new TextEncoder().encode(JSON.stringify(data,null,2));let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));const body={message:'WBoard: sync project workspace',content:btoa(binary)};if(remoteSha)body.sha=remoteSha;try{const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+PATH,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.message||'同步失败');remoteSha=j.content.sha;alert('项目数据已同步到 GitHub。')}catch(e){alert('GitHub 同步失败：'+e.message)}}
function openHub(v){hub.classList.add('open');mind.classList.remove('open');renderProjects();switchView(v||'projects')}function closeAll(){hub.classList.remove('open');mind.classList.remove('open')}
function switchView(v){document.querySelectorAll('.wb-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#wbProjectsView').hidden=v!=='projects';$('#wbTasksView').hidden=v!=='tasks';if(v==='tasks')renderTasks()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderProjects(){const grid=$('#wbProjectGrid');grid.innerHTML='';if(!data.projects.length){grid.innerHTML='<div class="wb-empty" style="grid-column:1/-1">暂无项目，点击“新建项目”开始。</div>';return}data.projects.forEach(p=>{const el=document.createElement('article');el.className='wb-card wb-project';const tasks=p.tasks||[],done=tasks.filter(t=>t.status==='done').length;el.innerHTML='<h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'暂无项目说明')+'</p><div class="wb-meta"><span>'+tasks.length+' 项任务 · '+(p.nodes||[]).length+' 个导图节点</span><span>'+done+'/'+tasks.length+' 已完成</span></div>';el.onclick=()=>{active=p.id;switchView('tasks')};grid.append(el)})}
function renderTasks(){const p=project();if(!p){$('#wbKanban').innerHTML='<div class="wb-empty">请先创建项目。</div>';return}$('#wbTaskProjectName').textContent=p.name+' · 任务看板';const lanes=[['todo','待办'],['doing','进行中'],['review','待审核'],['done','已完成']];$('#wbKanban').innerHTML=lanes.map(a=>'<div class="wb-lane"><h3>'+a[1]+' · '+p.tasks.filter(t=>t.status===a[0]).length+'</h3><div data-lane="'+a[0]+'"></div></div>').join('');p.tasks.forEach(t=>{const lane=$('#wbKanban [data-lane="'+t.status+'"]');if(!lane)return;const el=document.createElement('div');el.className='wb-task';el.innerHTML='<strong>'+esc(t.title)+'</strong><small>'+esc(t.owner||'未分配')+(t.due?' · '+esc(t.due):'')+'</small><select><option value="todo">待办</option><option value="doing">进行中</option><option value="review">待审核</option><option value="done">已完成</option></select>';el.querySelector('select').value=t.status;el.querySelector('select').onchange=e=>{t.status=e.target.value;persist();renderTasks()};el.ondblclick=()=>{const v=prompt('修改任务名称',t.title);if(v!==null){t.title=v;persist();renderTasks()}};lane.append(el)})}
function newProject(){const name=prompt('项目名称');if(!name||!name.trim())return;const desc=prompt('项目简介（可留空）')||'',p={id:uid(),name:name.trim(),description:desc,tasks:[],nodes:[{id:uid(),text:name.trim(),x:400,y:180,parent:null}]};data.projects.push(p);active=p.id;persist();renderProjects();switchView('tasks')}
function addTask(){const p=project();if(!p)return;const title=prompt('任务名称');if(!title||!title.trim())return;const owner=prompt('负责人（可留空）')||'',due=prompt('截止日期 YYYY-MM-DD（可留空）')||'';p.tasks.push({id:uid(),title:title.trim(),owner,due,status:'todo'});persist();renderTasks()}
function openMind(){const p=project();if(!p){alert('请先选择项目');return}hub.classList.remove('open');mind.classList.add('open');$('#wbMindTitle').textContent=p.name+' · 思维导图';renderMind()}
function drawLines(){const p=project(),svg=$('#wbMindSvg');svg.innerHTML='';if(!p)return;p.nodes.forEach(n=>{const q=p.nodes.find(x=>x.id===n.parent);if(!q)return;const path=document.createElementNS('http://www.w3.org/2000/svg','path');const ax=q.x+70,ay=q.y+22,bx=n.x+70,by=n.y+22;path.setAttribute('d','M'+ax+','+ay+' C'+((ax+bx)/2)+','+ay+' '+((ax+bx)/2)+','+by+' '+bx+','+by);path.setAttribute('fill','none');path.setAttribute('stroke','#b8b8b0');path.setAttribute('stroke-width','2');svg.append(path)})}
function renderMind(){const p=project();if(!p)return;const root=$('#wbMindNodes');root.innerHTML='';drawLines();p.nodes.forEach(n=>{const el=document.createElement('div');el.className='wb-mindnode'+(!n.parent?' root':'')+(selectedNode===n.id?' selected':'');el.style.left=n.x+'px';el.style.top=n.y+'px';el.textContent=n.text;el.onpointerdown=e=>{selectedNode=n.id;dragNode={id:n.id,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y};el.setPointerCapture(e.pointerId);el.classList.add('selected')};el.onpointermove=e=>{if(!dragNode||dragNode.id!==n.id)return;n.x=dragNode.x+e.clientX-dragNode.sx;n.y=dragNode.y+e.clientY-dragNode.sy;el.style.left=n.x+'px';el.style.top=n.y+'px';drawLines()};el.onpointerup=()=>{if(dragNode&&dragNode.id===n.id){dragNode=null;persist();renderMind()}};el.ondblclick=()=>{const v=prompt('编辑节点',n.text);if(v!==null){n.text=v;persist();renderMind()}};el.onclick=()=>{selectedNode=n.id;renderMind()};root.append(el)})}
function addNode(){const p=project();if(!p)return;const parent=p.nodes.find(n=>n.id===selectedNode)||p.nodes[0],v=prompt('新节点名称','新分支');if(!v||!v.trim())return;const n={id:uid(),text:v.trim(),x:parent.x+240,y:parent.y+100,parent:parent.id};p.nodes.push(n);selectedNode=n.id;persist();renderMind()}
function connect(){const p=project();if(!p||!selectedNode)return;if(!connectFrom){connectFrom=selectedNode;alert('起点已选定，请选择目标节点后再次点击连接。');return}if(connectFrom===selectedNode){connectFrom=null;return}const n=p.nodes.find(x=>x.id===selectedNode);if(n)n.parent=connectFrom;connectFrom=null;persist();renderMind()}
function removeNode(){const p=project();if(!p||!selectedNode)return;const gone=new Set([selectedNode]);let change=true;while(change){change=false;p.nodes.forEach(n=>{if(gone.has(n.parent)&&!gone.has(n.id)){gone.add(n.id);change=true}})}if(gone.size===p.nodes.length){alert('根节点不能删除');return}p.nodes=p.nodes.filter(n=>!gone.has(n.id));selectedNode=null;persist();renderMind()}
$('#wbBack').onclick=closeAll;$('#wbMindBack').onclick=()=>openHub('tasks');$('#wbGitSettings').onclick=settings;$('#wbNewProject').onclick=newProject;$('#wbAddTask').onclick=addTask;$('#wbOpenMind').onclick=openMind;$('#wbAddNode').onclick=addNode;$('#wbConnect').onclick=connect;$('#wbDeleteNode').onclick=removeNode;document.querySelectorAll('.wb-tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
const top=$('.top'),spacer=top.querySelector('.spacer');function addTop(label,cls,fn){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;top.insertBefore(b,spacer)}addTop('项目管理','wb-extra',()=>openHub('projects'));addTop('思维导图','wb-extra',()=>{if(!active&&data.projects[0])active=data.projects[0].id;if(!active){openHub('projects');alert('请先创建项目');return}openMind()});addTop('GitHub 同步','wb-extra dark',saveRemote);
if(token)loadRemote();
})();
</script>

<style id="wb-ui-polish">
.top .file{padding:7px 9px;border-radius:8px}.file:focus{background:#f1f1ed}
.btn,.wb-btn{transition:background .16s ease,transform .16s ease}.btn:active,.wb-btn:active{transform:scale(.97)}
.panel,.zoom,.bottom{box-shadow:0 5px 22px #00000008}.workspace{overscroll-behavior:none}
.item.selected{outline:2px solid #6485ef;outline-offset:4px;border-radius:8px}
.item[contenteditable=true]{outline:2px solid #6485ef;outline-offset:3px}
.note[contenteditable=true],.textitem[contenteditable=true]{cursor:text;user-select:text}
#empty{width:min(440px,calc(100% - 40px));padding:28px 24px;border:1px solid #e9e9e5;border-radius:18px;background:#ffffffa8;backdrop-filter:blur(12px);box-shadow:0 12px 36px #00000008}
#empty strong{font-size:17px;letter-spacing:-.3px}#empty small{line-height:1.8}
@media(max-width:700px){.top .wb-extra{display:none}.panel{left:10px;right:auto}.panel .btn{font-size:11px}.note{width:185px;min-height:130px;padding:13px;font-size:13px}}
</style></body></html>
